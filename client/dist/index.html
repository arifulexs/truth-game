<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1B1428" />
    <title>Truth — a private game for two</title>
    <meta name="description" content="A private, real-time Truth game for exactly two friends." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,400..600,0..100&family=Fraunces:ital,opsz,wght,SOFT@1,9..144,500..600,0..100&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <script>
      // Applied before React mounts so the correct theme is visible on the
      // very first paint — no flash of the wrong mode.
      (function () {
        try {
          var stored = localStorage.getItem('truth-game:theme') || 'system';
          var resolved =
            stored === 'system'
              ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
              : stored;
          document.documentElement.setAttribute('data-theme', resolved);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <script type="module" crossorigin src="/assets/index-Dp1O_kuX.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-BxjjvrV0.css">
  </head>

    <div id="root"></div>
  </body>
</html>
